name: Coverage contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Check client synchronization with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race .
        env:
          CGO_ENABLED: '1'
      - run: go run ./cmd/adcoverage
      - name: Check reference fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-reference-cleanup.ps1
      - name: Compare recorded module using Windows PowerShell 5.1 defaults
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: powershell.exe -NoProfile -File .\scripts\lab\compare-reference.ps1 -ModulePath .\coverage\lab\server2025\module.json
      - name: Check isolated lab removal on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-removal.ps1
      - name: Check lab media and provisioning on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-provision.ps1
      - name: Cross-compile Windows native tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go test -mod=readonly -c -o "$RUNNER_TEMP/conditions-$arch.test.exe" ./conditions
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go test -mod=readonly -c -o "$RUNNER_TEMP/client-$arch.test.exe" .
          done
      - name: Check RootDSE reference projection on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-rootdse-projection.ps1
      - name: Check connection denial fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-connection-cleanup.ps1
      - name: Check explicit credential fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-credential-fixture-cleanup.ps1
      - name: Check search fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-search-fixture-cleanup.ps1
      - name: Check search permission fixture on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-search-permission.ps1
