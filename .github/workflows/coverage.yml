name: Coverage contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go run ./cmd/adcoverage
      - name: Check reference fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-reference-cleanup.ps1
      - name: Cross-compile Windows native tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go test -mod=readonly -c -o "$RUNNER_TEMP/conditions-$arch.test.exe" ./conditions
          done
