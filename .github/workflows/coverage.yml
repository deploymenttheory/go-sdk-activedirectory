name: Coverage contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - name: Compile retained standalone Kerberos examples
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for example in example.go example-AD.go httpClient.go httpServer.go longRunningClient.go; do
            go build -mod=readonly -o "$RUNNER_TEMP/kerberos-$example.exe" "./3rd_party/gokrb5/v8/examples/$example"
          done
      - name: Compile retained standalone Kerberos examples on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($example in @('example.go', 'example-AD.go', 'httpClient.go', 'httpServer.go', 'longRunningClient.go')) {
            go build -mod=readonly -o "$env:RUNNER_TEMP/kerberos-$example.exe" "./3rd_party/gokrb5/v8/examples/$example"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check client synchronization with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./activedirectory/... ./3rd_party/ldap/v3/... ./3rd_party/gokrb5/v8/... ./3rd_party/msrpc/...
        env:
          CGO_ENABLED: '1'
      - run: go run ./cmd/adcoverage
      - name: Check independent Kerberos fixture input guards
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/lab/test-kerberos-reference.py -v
      - name: Check owned lab fixtures and case coverage on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\lab\test-kerberos-fixture.ps1
          .\scripts\lab\test-kerberos-auth-cases.ps1
          .\scripts\lab\test-kerberos-sasl-cases.ps1
          .\scripts\lab\test-kerberos-write-fixture.ps1
          .\scripts\lab\test-kerberos-sasl-peer.ps1
          .\scripts\lab\test-security-descriptor-fixture.ps1
          .\scripts\lab\test-portable-linux.ps1
          .\scripts\lab\test-policy-conditions-fixture.ps1
      - name: Check owned lab fixtures and case coverage on PowerShell 7
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\lab\test-kerberos-fixture.ps1
          .\scripts\lab\test-kerberos-auth-cases.ps1
          .\scripts\lab\test-kerberos-sasl-cases.ps1
          .\scripts\lab\test-kerberos-write-fixture.ps1
          .\scripts\lab\test-kerberos-sasl-peer.ps1
          .\scripts\lab\test-security-descriptor-fixture.ps1
          .\scripts\lab\test-portable-linux.ps1
          .\scripts\lab\test-policy-conditions-fixture.ps1
          .\scripts\lab\test-kerberos-qualification.ps1
          .\scripts\lab\test-kerberos-client-files.ps1
          .\scripts\lab\test-kerberos-outer-guards.ps1
      - name: Check nested source snapshots on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-source-snapshot.ps1
      - name: Check reference fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-reference-cleanup.ps1
      - name: Compare recorded module using Windows PowerShell 5.1 defaults
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: powershell.exe -NoProfile -File .\scripts\lab\compare-reference.ps1 -ModulePath .\coverage\lab\server2025\module.json
      - name: Check isolated lab removal on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-removal.ps1
      - name: Check lab media and provisioning on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-provision.ps1
      - name: Check directory readiness on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-directory-readiness.ps1
      - name: Check LDS trust-state ownership on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-lds-paths.ps1
      - name: Check LDS certificate-matrix evidence and cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-lds-tls-harness.ps1
      - name: Check LDS peer launch and cleanup failures on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-lds-tls-cleanup.ps1
      - name: Check LDS CAPI2 certificate-policy evidence on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-lds-certificate-policy.ps1
      - name: Cross-compile Windows native tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go test -mod=readonly -c -o "$RUNNER_TEMP/conditions-$arch.test.exe" ./conditions
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 \
              go test -mod=readonly -c -o "$RUNNER_TEMP/client-$arch.test.exe" ./activedirectory/acceptance
          done
      - name: Check RootDSE reference projection on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-rootdse-projection.ps1
      - name: Check connection denial fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-connection-cleanup.ps1
      - name: Check explicit credential fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-credential-fixture-cleanup.ps1
      - name: Check search fixture cleanup on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-search-fixture-cleanup.ps1
      - name: Check directory reference harness on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-directory-harness.ps1
      - name: Check directory reference harness on PowerShell 7
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\lab\test-directory-harness.ps1
      - name: Check search permission fixture on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-search-permission.ps1
      - name: Check LDS search reference projection on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\lab\test-lds-search-projection.ps1
