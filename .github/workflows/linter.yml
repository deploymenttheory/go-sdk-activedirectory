name: Linter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Set up latest stable Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Super-Linter v9.0.0 bundles golangci-lint 2.13.2, which cannot read
      # Go 1.27 export data. Run the same module-aware check with a current tool.
      - name: Lint Go modules
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=30m --config=./.golangci.yml --fix=false
          # The local merge-base filter in .golangci.yml handles changed files.
          only-new-issues: false
